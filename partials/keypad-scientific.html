<section class="keypad scientific-keypad hidden" data-keypad="scientific">

  <!-- Utility row -->
  <button class="key function" data-action="toggle-angle">DEG</button>
  <button class="key function" data-action="clear">C</button>
  <button class="key function" data-action="backspace">⌫</button>
  <button class="key operator" data-value="/">÷</button>

  <!-- Function row -->
  <button class="key function" data-fn="sin">sin</button>
  <button class="key function" data-fn="cos">cos</button>
  <button class="key function" data-fn="tan">tan</button>
  <button class="key operator" data-value="*">×</button>

  <button class="key function" data-fn="log">log</button>
  <button class="key function" data-fn="ln">ln</button>
  <button class="key" data-value="(">(</button>
  <button class="key operator" data-value="-">−</button>

  <!-- Numbers -->
  <button class="key" data-value="7">7</button>
  <button class="key" data-value="8">8</button>
  <button class="key" data-value="9">9</button>
  <button class="key operator" data-value="+">+</button>

  <button class="key" data-value="4">4</button>
  <button class="key" data-value="5">5</button>
  <button class="key" data-value="6">6</button>
  <button class="key" data-value=")">)</button>

  <button class="key" data-value="1">1</button>
  <button class="key" data-value="2">2</button>
  <button class="key" data-value="3">3</button>
  <button class="key operator tall" data-action="equals">=</button>

  <button class="key wide" data-value="0">0</button>
  <button class="key" data-value=".">.</button>

</section>
