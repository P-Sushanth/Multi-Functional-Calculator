<section class="graph-controls hidden" data-panel="graph">
  <input
    class="graph-input"
    id="functionInput"
    placeholder="f(x) = x^2"
  />
  <button class="key function" data-action="plot">Plot</button>
  <button class="key function" data-action="clear-graph">Clear</button>
  <button class="key function" data-action="toggle-3d">3D</button>
</section>

<div class="graph-container hidden" id="graphContainer"></div>
