<section class="keypad programming-keypad hidden" data-keypad="programming">

  <!-- Base selectors -->
  <button class="key function base-btn active" data-base="DEC">DEC</button>
  <button class="key function base-btn" data-base="BIN">BIN</button>
  <button class="key function base-btn" data-base="OCT">OCT</button>
  <button class="key function base-btn" data-base="HEX">HEX</button>

  <!-- Utility -->
  <button class="key function" data-action="clear">C</button>
  <button class="key function" data-action="backspace">⌫</button>

  <!-- Numbers -->
  <button class="key num-key" data-value="7">7</button>
  <button class="key num-key" data-value="8">8</button>
  <button class="key num-key" data-value="9">9</button>
  
  <button class="key num-key" data-value="4">4</button>
  <button class="key num-key" data-value="5">5</button>
  <button class="key num-key" data-value="6">6</button>
  
  <button class="key num-key" data-value="1">1</button>
  <button class="key num-key" data-value="2">2</button>
  <button class="key num-key" data-value="3">3</button>
  
  <button class="key num-key wide" data-value="0">0</button>  

  <!-- HEX keys -->
  <button class="key hex-key hidden" data-value="A">A</button>
  <button class="key hex-key hidden" data-value="B">B</button>
  <button class="key hex-key hidden" data-value="C">C</button>
  <button class="key hex-key hidden" data-value="D">D</button>
  <button class="key hex-key hidden" data-value="E">E</button>
  <button class="key hex-key hidden" data-value="F">F</button>

</section>
